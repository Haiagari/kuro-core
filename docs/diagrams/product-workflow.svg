<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%">
  <defs>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&amp;display=swap");
      text { font-family: "JetBrains Mono", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace; }
      .title { font-size: 11px; font-weight: 800; letter-spacing: 2px; text-transform: uppercase; }
      .header { font-size: 14px; font-weight: 700; fill: #ffffff; letter-spacing: 0.5px; }
      .sub { font-size: 11px; font-weight: 500; fill: #94a3b8; }
      .code { font-size: 11px; font-weight: 600; fill: #38bdf8; }
      .badge { font-size: 10px; font-weight: 700; letter-spacing: 1px; }
    </style>

    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07090e"/>
      <stop offset="50%" stop-color="#0a0e17"/>
      <stop offset="100%" stop-color="#06080c"/>
    </linearGradient>

    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <linearGradient id="kuro-card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#161f30" stroke-width="0.6" stroke-opacity="0.5"/>
    </pattern>

    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#00f2fe" flood-opacity="0.4"/>
    </filter>
    <filter id="glow-green" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#10b981" flood-opacity="0.5"/>
    </filter>
    <filter id="glow-red" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#f43f5e" flood-opacity="0.5"/>
    </filter>

    <marker id="arr-cyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 2 L 8 5 L 1 8 Z" fill="#00f2fe"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 2 L 8 5 L 1 8 Z" fill="#10b981"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 2 L 8 5 L 1 8 Z" fill="#f59e0b"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 2 L 8 5 L 1 8 Z" fill="#f43f5e"/>
    </marker>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="380" rx="16" fill="url(#bg-grad)"/>
  <rect width="1200" height="380" rx="16" fill="url(#grid)"/>
  <rect x="1" y="1" width="1198" height="378" rx="15" fill="none" stroke="#1e293b" stroke-width="1.2"/>

  <!-- Top Decorative Header Bar -->
  <g transform="translate(35, 28)">
    <rect x="0" y="0" width="4" height="16" rx="2" fill="#00f2fe"/>
    <text x="14" y="13" class="title" fill="#00f2fe">KURO CORE // PRODUCT WORKFLOW</text>
    <text x="320" y="13" font-size="11" font-weight="500" fill="#64748b">|  LOCAL-FIRST PRE-PUSH APPSEC PIPELINE &amp; POLICY VERDICT</text>
    <g transform="translate(1010, -2)">
      <rect x="0" y="0" width="120" height="20" rx="4" fill="#0b1322" stroke="#1e293b" stroke-width="1"/>
      <text x="60" y="14" text-anchor="middle" font-size="9" font-weight="700" fill="#38bdf8" letter-spacing="1">ZERO SERVER</text>
    </g>
  </g>

  <!-- STEP 1: DEVELOPER WORKSTATION (X: 35, Y: 70, W: 190, H: 270) -->
  <g transform="translate(35, 70)">
    <rect width="190" height="270" rx="12" fill="url(#kuro-card)" stroke="#334155" stroke-width="1.2"/>
    <rect x="14" y="16" width="28" height="20" rx="4" fill="#0284c7" opacity="0.2"/>
    <text x="28" y="30" text-anchor="middle" font-size="11" font-weight="800" fill="#38bdf8">&gt;_</text>
    <text x="50" y="31" class="header">Developer</text>
    <text x="14" y="56" class="sub">Workstation Codebase</text>

    <g transform="translate(14, 76)">
      <rect width="162" height="42" rx="6" fill="#060911" stroke="#1e293b" stroke-width="1"/>
      <text x="10" y="18" class="badge" fill="#94a3b8">TRIGGER A</text>
      <text x="10" y="33" class="code">git push origin</text>
    </g>

    <g transform="translate(14, 126)">
      <rect width="162" height="42" rx="6" fill="#060911" stroke="#1e293b" stroke-width="1"/>
      <text x="10" y="18" class="badge" fill="#94a3b8">TRIGGER B</text>
      <text x="10" y="33" class="code">kuro scan [dir]</text>
    </g>

    <g transform="translate(14, 180)">
      <rect width="162" height="74" rx="6" fill="#060911" stroke="#1e293b" stroke-width="1"/>
      <text x="10" y="20" font-size="10" font-weight="700" fill="#e2e8f0">Target Scope:</text>
      <text x="10" y="38" font-size="10" font-weight="500" fill="#64748b">• Working tree / Staged</text>
      <text x="10" y="52" font-size="10" font-weight="500" fill="#64748b">• Full history (--history)</text>
      <text x="10" y="66" font-size="10" font-weight="500" fill="#64748b">• Differential file cache</text>
    </g>
  </g>

  <!-- ARROW 1 -> 2 -->
  <path d="M 225 205 L 260 205" fill="none" stroke="#00f2fe" stroke-width="2" marker-end="url(#arr-cyan)"/>

  <!-- STEP 2: KURO CORE RUNTIME & SCANNER FLEET (X: 270, Y: 70, W: 450, H: 270) -->
  <g transform="translate(270, 70)">
    <rect width="450" height="270" rx="12" fill="#090d16" stroke="#00f2fe" stroke-width="1.4" filter="url(#glow-cyan)"/>
    
    <!-- Header -->
    <rect x="16" y="16" width="30" height="20" rx="4" fill="#00f2fe" opacity="0.15"/>
    <text x="31" y="30" text-anchor="middle" font-size="12" font-weight="800" fill="#00f2fe">黒</text>
    <text x="54" y="31" class="header">Kuro Core Gate</text>
    <text x="200" y="31" font-size="11" font-weight="600" fill="#38bdf8">Single Binary (Go)</text>

    <g transform="translate(320, 16)">
      <rect width="114" height="20" rx="4" fill="#06121f" stroke="#00f2fe" stroke-width="0.8"/>
      <text x="57" y="14" text-anchor="middle" font-size="9" font-weight="700" fill="#00f2fe" letter-spacing="0.5">HARDENED FLEET</text>
    </g>

    <!-- Hardened Container Fleet Box (2x2 Grid) -->
    <g transform="translate(16, 52)">
      <rect width="418" height="132" rx="8" fill="#060910" stroke="#1e293b" stroke-width="1"/>
      <text x="12" y="18" font-size="10" font-weight="800" fill="#64748b" letter-spacing="1">ISOLATED CONTAINERS (--network=none, --cap-drop=ALL)</text>

      <!-- Scanner 1: SAST -->
      <g transform="translate(12, 28)">
        <rect width="192" height="42" rx="6" fill="#0d1527" stroke="#1e293b" stroke-width="1"/>
        <text x="10" y="18" font-size="11" font-weight="700" fill="#ffffff">&lt;/&gt; SAST</text>
        <text x="68" y="18" font-size="10" font-weight="600" fill="#38bdf8">Semgrep</text>
        <text x="10" y="33" font-size="9.5" font-weight="500" fill="#94a3b8">Embedded offline rules</text>
      </g>

      <!-- Scanner 2: Secrets -->
      <g transform="translate(214, 28)">
        <rect width="192" height="42" rx="6" fill="#0d1527" stroke="#1e293b" stroke-width="1"/>
        <text x="10" y="18" font-size="11" font-weight="700" fill="#ffffff">🔒 Secrets</text>
        <text x="82" y="18" font-size="10" font-weight="600" fill="#38bdf8">Gitleaks</text>
        <text x="10" y="33" font-size="9.5" font-weight="500" fill="#94a3b8">Zero-leakage ruleset</text>
      </g>

      <!-- Scanner 3: SCA -->
      <g transform="translate(12, 78)">
        <rect width="192" height="42" rx="6" fill="#0d1527" stroke="#1e293b" stroke-width="1"/>
        <text x="10" y="18" font-size="11" font-weight="700" fill="#ffffff">📦 SCA</text>
        <text x="64" y="18" font-size="10" font-weight="600" fill="#38bdf8">Trivy</text>
        <text x="10" y="33" font-size="9.5" font-weight="500" fill="#94a3b8">Lockfile CVE scan</text>
      </g>

      <!-- Scanner 4: IaC -->
      <g transform="translate(214, 78)">
        <rect width="192" height="42" rx="6" fill="#0d1527" stroke="#1e293b" stroke-width="1"/>
        <text x="10" y="18" font-size="11" font-weight="700" fill="#ffffff">📄 IaC</text>
        <text x="64" y="18" font-size="10" font-weight="600" fill="#38bdf8">Checkov</text>
        <text x="10" y="33" font-size="9.5" font-weight="500" fill="#94a3b8">Dockerfile &amp; Terraform</text>
      </g>
    </g>

    <!-- Embedded Policy Engine Bar -->
    <g transform="translate(16, 194)">
      <rect width="418" height="62" rx="8" fill="#0b1324" stroke="#38bdf8" stroke-width="1.2"/>
      <g transform="translate(12, 16)">
        <circle cx="6" cy="6" r="4" fill="#00f2fe"/>
        <text x="18" y="10" font-size="12" font-weight="800" fill="#ffffff">Embedded Policy Engine</text>
        <text x="195" y="10" class="code">(default-policy.json)</text>
        <text x="0" y="30" font-size="10" font-weight="500" fill="#94a3b8">Deduplication (SHA-256 + Jaccard) → Severity Evaluation → Fail-Closed Gate</text>
      </g>
    </g>
  </g>

  <!-- ARROWS 2 -> 3 (3 Branches) -->
  <path d="M 720 150 L 765 125" fill="none" stroke="#10b981" stroke-width="2" marker-end="url(#arr-green)"/>
  <path d="M 720 205 L 765 205" fill="none" stroke="#f59e0b" stroke-width="2" marker-end="url(#arr-amber)"/>
  <path d="M 720 260 L 765 285" fill="none" stroke="#f43f5e" stroke-width="2" marker-end="url(#arr-red)"/>

  <!-- STEP 3: DECISION ENVELOPE (X: 775, Y: 70, W: 180, H: 270) -->
  <!-- Branch A: PASS -->
  <g transform="translate(775, 80)">
    <rect width="180" height="68" rx="8" fill="#061c14" stroke="#10b981" stroke-width="1.4" filter="url(#glow-green)"/>
    <circle cx="20" cy="22" r="8" fill="#10b981" opacity="0.2"/>
    <text x="20" y="26" text-anchor="middle" font-size="11" font-weight="900" fill="#10b981">&#x2713;</text>
    <text x="36" y="26" font-size="13" font-weight="800" fill="#ffffff">PASS</text>
    <text x="96" y="26" class="badge" fill="#10b981">(exit 0)</text>
    <text x="14" y="46" font-size="10" font-weight="600" fill="#34d399">Clean / policy approved</text>
    <text x="14" y="58" font-size="9.5" font-weight="500" fill="#6ee7b7">Differential cache saved</text>
  </g>

  <!-- Branch B: REVIEW -->
  <g transform="translate(775, 171)">
    <rect width="180" height="68" rx="8" fill="#1f1406" stroke="#f59e0b" stroke-width="1.2"/>
    <circle cx="20" cy="22" r="8" fill="#f59e0b" opacity="0.2"/>
    <text x="20" y="26" text-anchor="middle" font-size="11" font-weight="900" fill="#f59e0b">!</text>
    <text x="36" y="26" font-size="13" font-weight="800" fill="#ffffff">REVIEW</text>
    <text x="110" y="26" class="badge" fill="#f59e0b">(exit 2)</text>
    <text x="14" y="46" font-size="10" font-weight="600" fill="#fbbf24">Advisory warnings</text>
    <text x="14" y="58" font-size="9.5" font-weight="500" fill="#fde68a">Threshold triage required</text>
  </g>

  <!-- Branch C: BLOCK -->
  <g transform="translate(775, 262)">
    <rect width="180" height="68" rx="8" fill="#240a11" stroke="#f43f5e" stroke-width="1.4" filter="url(#glow-red)"/>
    <circle cx="20" cy="22" r="8" fill="#f43f5e" opacity="0.2"/>
    <text x="20" y="26" text-anchor="middle" font-size="11" font-weight="900" fill="#f43f5e">&#x2717;</text>
    <text x="36" y="26" font-size="13" font-weight="800" fill="#ffffff">BLOCK</text>
    <text x="104" y="26" class="badge" fill="#f43f5e">(exit 1)</text>
    <text x="14" y="46" font-size="10" font-weight="600" fill="#fb7185">Critical breach or error</text>
    <text x="14" y="58" font-size="9.5" font-weight="500" fill="#fda4af">Push strictly rejected</text>
  </g>

  <!-- ARROW TO REMOTE FORGE -->
  <path d="M 955 114 L 1005 114" fill="none" stroke="#10b981" stroke-width="2" marker-end="url(#arr-green)"/>
  
  <!-- ARROW TO REMEDIATION / DEV -->
  <path d="M 955 296 L 1005 296" fill="none" stroke="#f43f5e" stroke-width="2" marker-end="url(#arr-red)"/>

  <!-- STEP 4: DESTINATIONS (X: 1015) -->
  <!-- Target: Remote Forge -->
  <g transform="translate(1015, 80)">
    <rect width="150" height="68" rx="8" fill="#081424" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="14" y="24" font-size="12" font-weight="800" fill="#ffffff">Remote Forge</text>
    <text x="14" y="42" font-size="10" font-weight="600" fill="#38bdf8">GitHub / GitLab</text>
    <text x="14" y="56" font-size="9" font-weight="500" fill="#94a3b8">Clean push delivered</text>
  </g>

  <!-- Target: Local Fix / Triage -->
  <g transform="translate(1015, 262)">
    <rect width="150" height="68" rx="8" fill="#140b12" stroke="#f43f5e" stroke-width="1.2"/>
    <text x="14" y="24" font-size="12" font-weight="800" fill="#ffffff">Developer Fix</text>
    <text x="14" y="42" font-size="10" font-weight="600" fill="#f43f5e">kuro fix / triage</text>
    <text x="14" y="56" font-size="9" font-weight="500" fill="#94a3b8">Interactive remediation</text>
  </g>
</svg>
