# Secret Scanning — GitHub Actions
# Runs Gitleaks on every push and PR to detect leaked secrets.
# Docs: https://github.com/gitleaks/gitleaks

name: "🔒 Secret Scanning"

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Run weekly on Monday at 9:00 UTC
    - cron: "0 9 * * 1"

permissions:
  contents: read
  security-events: write  # For GitHub Security tab integration

jobs:
  gitleaks:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # Full history for better detection
          persist-credentials: false

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

      - name: Upload SARIF report
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
        continue-on-error: true

  trufflehog:
    name: TruffleHog Deep Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: TruffleHog Scan
        uses: trufflesecurity/trufflehog@v3.97.2
        with:
          extra_args: --only-verified
        continue-on-error: true  # Advisory only — does not block merges

  summary:
    name: Scan Summary
    runs-on: ubuntu-latest
    needs: [gitleaks, trufflehog]
    if: always()

    steps:
      - name: Report status
        run: |
          echo "## 🔒 Secret Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Scanner | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Gitleaks | ${{ needs.gitleaks.result == 'success' && '✅ Clean' || '⚠️ Check needed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| TruffleHog | ${{ needs.trufflehog.result == 'success' && '✅ Clean' || '⚠️ Check needed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Review the [Security tab](../../security) for detailed results." >> $GITHUB_STEP_SUMMARY
