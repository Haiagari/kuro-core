name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Lint and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go 1.26
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Verify Go Workspace & Modules
        run: |
          go work sync
          git diff --exit-code go.work.sum || true

      - name: Code Linting (vet)
        run: make lint

      - name: Unit & Integration Tests
        run: make test

      - name: Build Standalone Binary
        run: make build
