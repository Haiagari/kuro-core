name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Lint and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Go 1.26.4
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.4"

      - name: Verify Go Workspace & Modules
        run: |
          go work sync
          git diff --exit-code go.work.sum

      - name: Code Linting (vet)
        run: make lint

      - name: Unit & Integration Tests
        run: make test

      - name: Shell Helper Fixture Tests
        run: |
          python3 tests/test-install.py
          python3 tests/test-trivy-db-update.py
          python3 tests/test-pr-gate.py

      - name: Build Standalone Binary
        run: make build

  scanner-contracts:
    name: Native Scanner Contracts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.4"
      - name: Build
        run: make build
      - name: Pull scanner images
        run: |
          docker pull docker.io/zricethezav/gitleaks:v8.30.1
          docker pull docker.io/semgrep/semgrep:1.165.0
          docker pull docker.io/aquasec/trivy:0.57.0
          docker pull docker.io/bridgecrew/checkov:3.2.400
          docker pull docker.io/trufflesecurity/trufflehog:3.81.0
      - name: Prepare vulnerability DB without source mounts
        run: ./scripts/update-trivy-db.sh
      - name: Core clean and secret E2E
        run: make e2e-core
      - name: SAST, SCA, IaC and Git history contracts
        run: ./tests/e2e-scanner-contracts.sh

      - name: Trusted PR gate native acceptance
        run: python3 tests/e2e-pr-gate.py
      - name: Bootstrap gate on this PR snapshot using reviewed implementation
        if: github.event_name == 'pull_request'
        env:
          KURO_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags origin "$KURO_BASE_SHA"
          python3 scripts/ci/pr-gate.py --binary "$PWD/bin/kuro" --repo "$PWD" \
            --base "$KURO_BASE_SHA" --candidate "$(git rev-parse HEAD)" \
            --policy "$PWD/deploy/policies/default-policy.json" --output "$RUNNER_TEMP/bootstrap-gate.json"
      - name: Audit baseline finding metadata
        if: github.event_name == 'pull_request'
        env:
          KURO_AUDIT_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          python3 - <<'PY'
          import importlib.util, json, os, tempfile
          from pathlib import Path
          root = Path.cwd()
          spec = importlib.util.spec_from_file_location('gate', root/'scripts/ci/pr-gate.py')
          gate = importlib.util.module_from_spec(spec); spec.loader.exec_module(gate)
          with tempfile.TemporaryDirectory() as temp:
              source = Path(temp)
              files = gate.snapshot(root, os.environ['KURO_AUDIT_SHA'], source)
              findings = gate.identities(gate.scan(root/'bin/kuro', source, root/'deploy/policies/default-policy.json'), source, files)
              rows = [dict(scanner=f[0], severity=f[1], rule=f[2], file=f[3], line=f[4], detail=f[6]) for f in sorted(findings)]
              print('KURO_BASE_INVENTORY='+json.dumps(rows))
          PY
